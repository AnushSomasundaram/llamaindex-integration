[project]
name = "llama-index-meetstream"
version = "0.1.0"
description = "LlamaIndex integration for MeetStream: load meeting transcripts as Documents and give agents MeetStream tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "llama-index-core>=0.14,<0.15",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.urls]
Repository = "https://github.com/meetstream-ai/meetstream-langchain"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]
examples = [
    "llama-index-llms-openai>=0.3,<1.0",
    "llama-index-embeddings-openai>=0.3,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llama_index_meetstream"]

[tool.pytest.ini_options]
# Restricts a plain `pytest` invocation at the repo root to this package's own
# tests/ -- without this, pytest would also try to collect bridge/tests/ (now
# nested under this repo root, unlike the original monorepo layout where
# bridge/ was a sibling directory) and fail with a module-name collision,
# since both directories contain a `tests` package. `bridge/tests` still runs
# fine on its own via `(cd bridge && pytest)`, which is how it's actually run
# in docs/DEVELOPMENT.md and CI.
testpaths = ["tests"]

[tool.ruff]
line-length = 120
